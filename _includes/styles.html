<style>
  :root {
    --blue: #0969da;
    --green: #1a7f37;
    --red: #cf222e;
    --gray: #656d76;
    --bg: #ffffff;
    --surface: #f6f8fa;
    --border: #d0d7de;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); color: #24292f; background: var(--bg); line-height: 1.6; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .site-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1rem;
  }
  .site-header h1 { font-size: 1.25rem; margin: 0; }
  .site-header h1 a { color: inherit; text-decoration: none; }
  .site-header nav a { margin-right: 1rem; font-size: 0.9rem; }
  .site-footer {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 1rem 1.5rem; font-size: 0.8rem; color: var(--gray); margin-top: 2rem;
  }
  .site-footer p { margin-bottom: 0.25rem; }
  .container { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  .card h3 { font-size: 1rem; margin-bottom: 0.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; background: var(--surface); }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge-ok { background: #dafae1; color: var(--green); }
  .badge-warn { background: #fff8c5; color: #9a6700; }
  .badge-err { background: #ffebe9; color: var(--red); }
  .section-title { font-size: 1.3rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
  @media (max-width: 600px) {
    .site-header { flex-direction: column; align-items: flex-start; }
    .container { padding: 1rem; }
    table { font-size: 0.8rem; }
    th, td { padding: 0.3rem 0.4rem; }
  }
</style>
