[project]
name = "harga-pangan-dq"
version = "0.1.0"
description = "A live data-quality monitor for Indonesian strategic food prices (PIHPS Nasional, Bank Indonesia)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "duckdb>=1.5.6,<1.6",
    "httpx>=0.28.1,<0.29",
    "typer>=0.29.1,<0.30",
]

[project.scripts]
hpdq = "hpdq.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<2.5",
    "pytest>=9.2.0,<9.3",
    "ruff>=0.17.4,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpdq"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
