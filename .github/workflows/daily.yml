name: daily

on:
  schedule:
    # Run at 14:20 WIB and 17:20 WIB (UTC+7)
    # 14:20 WIB = 07:20 UTC
    # 17:20 WIB = 10:20 UTC
    - cron: "20 7 * * 1-5"
    - cron: "20 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Business date (YYYY-MM-DD)"
        required: false
        default: ""
      group:
        description: "Commodity group (all | chillies)"
        required: false
        default: "all"

permissions:
  contents: write
  issues: write

env:
  HPDQ_DATA_DIR: ${{ github.workspace }}/data
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ingest:
    name: ingest, build, check, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      # --- Ingest ---
      - name: Ingest
        run: |
          CMD="uv run hpdq ingest"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            CMD="$CMD --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.group }}" != "all" ] && [ -n "${{ github.event.inputs.group }}" ]; then
            CMD="$CMD --group ${{ github.event.inputs.group }}"
          fi
          eval "$CMD"

      # --- Append-only assertion ---
      - name: Verify append-only
        run: uv run hpdq raw verify

      # --- Build dbt marts ---
      - name: Build dbt
        run: uv run hpdq build

      # --- Run checks ---
      - name: Run checks
        run: uv run hpdq check || true

      # --- Deploy static site data ---
      - name: Deploy site data
        run: uv run hpdq deploy

      # --- Commit and push data branch ---
      - name: Push to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B data origin/data 2>/dev/null || git checkout -b data
          git add -f data/site/
          git add -f data/*.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: update site data $(date +%Y-%m-%d)"
            git push origin data
          fi
